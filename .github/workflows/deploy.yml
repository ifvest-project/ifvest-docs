# Publica a documentação no GitHub Pages sempre que algo entra na main.
# Baseado no exemplo oficial do Material for MkDocs ("Publishing your site").
name: Publicar documentação

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" na aba Actions: publica sem precisar de commit

permissions:
  contents: write # o deploy envia a branch gh-pages, então precisa de escrita

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Servidor PlantUML próprio, que só existe durante este build: os diagramas do site
    # publicado deixam de depender do plantuml.com, que às vezes devolve o SVG de
    # diagramas de componentes quebrado (https://github.com/plantuml/plantuml/issues/2197).
    # A etiqueta fixa a versão do PlantUML; para atualizar, troque v1.2026.8 por outra.
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty-v1.2026.8
        ports:
          - 8080:8080
        # Os passos só começam quando o servidor já desenha um diagrama de teste
        options: >-
          --health-cmd "curl -fsS -o /dev/null http://localhost:8080/svg/SyfFKj2rKt3CoKnELR1Io4ZDoSa70000"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24

    env:
      PLANTUML_SERVER: http://localhost:8080 # lido pelo mkdocs.yml, no lugar do plantuml.com

    steps:
      - uses: actions/checkout@v7

      - name: Identificar o autor do commit de publicação
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      # Guarda as dependências baixadas; a chave muda a cada semana do ano
      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-

      # As mesmas dependências da máquina local (Material, PlantUML, Swagger)
      - run: pip install -r requirements.txt

      # --force: a gh-pages só guarda o site gerado; cada publicação a substitui inteira
      - run: mkdocs gh-deploy --force