site_name: IFVest — Documentação
site_description: Documentação oficial da plataforma IFVest — IFSP Campus Jacareí
site_author: Ithalo Cavalcante Gomes
site_url: https://ifvest-project.github.io/ifvest-docs/


# Link do repositório no header+ + botão de editar 
repo_url: https://github.com/ifvest-project/ifvest-docs
repo_name: ifvest-docs
edit_uri: edit/main/docs/

copyright: IFVest — Projeto de Extensão · IFSP Campus Jacareí · Tecnologia em Análise e Desenvolvimento de Sistemas

theme:
  name: material
  custom_dir: overrides   # templates que substituem os do tema (logo da plataforma)
  favicon: images/favicon.svg   # o mesmo ícone da plataforma (ifvest-frontend/public/favicon.svg)
  language: pt

  # tema claro e escuro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Mudar para o tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Mudar para o tema claro

  font:
    text: Inter
    code: JetBrains Mono

  icon:
    repo: fontawesome/brands/github

  features:
    # Navegação
    - navigation.instant          # troca de página sem recarregar o site
    - navigation.instant.progress # barra de progresso no carregamento
    - navigation.tabs             # seções principais como abas no topo
    - navigation.tabs.sticky      # abas fixas ao rolar
    - navigation.sections         # subseções agrupadas na lateral
    - navigation.indexes          # index.md vira a página da própria seção
    - navigation.path             # caminho da página (trilha)
    - navigation.top              # botão "voltar ao topo"
    - navigation.footer           # links de página anterior / próxima
    - toc.follow                  # sumário lateral acompanha a leitura
    # Busca
    - search.suggest
    - search.highlight
    - search.share
    # Conteúdo
    - content.code.copy           # botão de copiar nos blocos de código
    - content.action.edit         # lápis de editar a página no GitHub
    - content.tooltips

hooks:
  - hooks/diagramas_tema.py   # versões clara e escura dos diagramas C4

extra_css:
  - stylesheets/extra.css
  - stylesheets/logo-ifvest.css

extra_javascript:
  - javascripts/swagger-instant.js   # Swagger da Referência da API com a navegação instantânea

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ifvest-project/ifvest-docs
      name: Repositório da documentação
    - icon: material/web
      link: https://ifvest.com.br/
      name: Plataforma IFVest

plugins:
  - search:
      lang: pt        # busca com processamento em português
  - swagger-ui-tag     # renderiza a especificação OpenAPI na Referência da API

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true          # ancora de link do lado dos titulos
      permalink_title: Link para esta seção
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - plantuml_markdown:
      # Na máquina local, os diagramas são desenhados pelo servidor público plantuml.com.
      # No GitHub Actions, PLANTUML_SERVER aponta para um servidor PlantUML próprio,
      # criado só durante o build (ver .github/workflows/deploy.yml)
      server: !ENV [PLANTUML_SERVER, "https://www.plantuml.com/plantuml"]
      format: svg

nav:
  - Início: index.md
  - Planejamento da Documentação: planejamento.md
  - O Sistema:
    - Descrição do Sistema: descricao-do-sistema.md
    - Arquitetura do Sistema: arquitetura.md
    - Modelo de Dados: modelo-de-dados.md
    - Referência da API: api.md
    - Diagramas C4:
      - Nível 1 — Contexto: c4/contexto.md
      - Nível 2 — Contêineres: c4/containers.md
      - Nível 3 — Componentes: c4/componentes.md
  - Requisitos:
    - Requisitos Funcionais: requisitos/funcionais.md
    - Requisitos Não-Funcionais: requisitos/nao-funcionais.md
  - Funcionalidades:
    - Descrição das Funcionalidades: funcionalidades.md
    - Registro de Versões: versoes.md
  - Subprojetos Ativos:
    - Visão Geral: subprojetos/index.md
    - "Eixo 1: Interface e Modernização (Frontend)": subprojetos/frontend.md
    - "Eixo 2: Qualidade, Testes e Acessibilidade": subprojetos/qualidade-e-testes.md
    - "Eixo 3: Inteligência Artificial e Recomendação": subprojetos/ia-e-recomendacao.md
    - "Eixo 4: Infraestrutura, APIs e Segurança": subprojetos/infra-e-seguranca.md
    - Produtos:
      - IFVest Reader: subprojetos/ifvest-reader.md
  - Guias de Uso:
    - Visão Geral: guias/index.md
    - Conta:
      - Acesso e Conta: guias/conta/acesso.md
      - Perfil e Seus Dados: guias/conta/perfil.md
    - Guia do Aluno:
      - Visão Geral: guias/aluno/index.md
      - Revisão de Conteúdo: guias/aluno/revisao.md
      - Flashcards: guias/aluno/flashcards.md
      - Simulados: guias/aluno/simulados.md
      - IFQuiz: guias/aluno/ifquiz.md
    - Guia do Professor:
      - Visão Geral: guias/professor/index.md
      - Banco de Questões: guias/professor/banco-de-questoes.md
      - Simulados: guias/professor/simulados.md
      - Flashcards: guias/professor/flashcards.md
      - Materiais de Revisão: guias/professor/materiais-de-revisao.md
    - Glossário: guias/glossario.md
